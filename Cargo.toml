[package]
name = "cpm"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Local preloader/tooling around CPM.cmake"
license = "MIT"

[[bin]]
name = "cpm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ureq = "2"
serde_json = "1"
dirs = "5"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = "0.6"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
bzip2 = "0.4"
terminal_size = "0.4"
semver = "1"
toml_edit = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
